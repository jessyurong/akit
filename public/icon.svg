    <ellipse cx="196" cy="232" rx="5.4" ry="8.2" transform="rotate(-14 196 232)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="256" cy="222" rx="5.4" ry="8.2" transform="rotate(0 256 222)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="316" cy="232" rx="5.4" ry="8.2" transform="rotate(14 316 232)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="166" cy="292" rx="5.4" ry="8.2" transform="rotate(-20 166 292)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="346" cy="292" rx="5.4" ry="8.2" transform="rotate(20 346 292)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="180" cy="356" rx="5.4" ry="8.2" transform="rotate(-16 180 356)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="332" cy="356" rx="5.4" ry="8.2" transform="rotate(16 332 356)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="210" cy="396" rx="5.4" ry="8.2" transform="rotate(-10 210 396)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="302" cy="396" rx="5.4" ry="8.2" transform="rotate(10 302 396)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="238" cy="424" rx="5.4" ry="8.2" transform="rotate(-6 238 424)" fill="#ffd45e" opacity="0.96"/>
<ellipse cx="274" cy="428" rx="5.4" ry="8.2" transform="rotate(6 274 428)" fill="#ffd45e" opacity="0.96"/>

    <!-- blush -->
    <ellipse cx="168" cy="330" rx="34" ry="18" fill="url(#blush)"/>
    <ellipse cx="344" cy="330" rx="34" ry="18" fill="url(#blush)"/>
  </g>

  <!-- eyes -->
  <ellipse cx="206" cy="290" rx="31" ry="34" fill="#ffffff" stroke="#8d0f28" stroke-width="4"/>
  <ellipse cx="306" cy="290" rx="31" ry="34" fill="#ffffff" stroke="#8d0f28" stroke-width="4"/>
  <ellipse cx="207" cy="292" rx="24.5" ry="27.5" fill="url(#iris)"/>
  <ellipse cx="307" cy="292" rx="24.5" ry="27.5" fill="url(#iris)"/>
  <circle cx="197" cy="279" r="9.5" fill="#ffffff"/>
  <circle cx="297" cy="279" r="9.5" fill="#ffffff"/>
  <circle cx="216" cy="305" r="4.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="316" cy="305" r="4.6" fill="#ffffff" opacity="0.9"/>

  <!-- smile -->
  <path d="M231 336 Q 256 364 281 336" fill="none" stroke="#4a0a1c"
