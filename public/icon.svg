<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="berry" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff9db1"/>
      <stop offset="0.45" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="238" r="200" fill="url(#glow)"/>

  <!-- berry body: round shoulders, pointed tip -->
  <path d="M256 430c-74-34-118-96-118-160 0-46 34-82 78-88 14-2 26-2 40 0 44 6 78 42 78 88 0 64-44 126-78 160Z" fill="url(#berry)"/>

  <!-- seeds -->
  <g fill="#ffefc4" opacity="0.9">
    <ellipse cx="176" cy="236" rx="4" ry="6" transform="rotate(-18 176 236)"/>
    <ellipse cx="222" cy="214" rx="4" ry="6" transform="rotate(-10 222 214)"/>
    <ellipse cx="268" cy="212" rx="4" ry="6" transform="rotate(8 268 212)"/>
    <ellipse cx="318" cy="230" rx="4" ry="6" transform="rotate(18 318 230)"/>
    <ellipse cx="196" cy="286" rx="4" ry="6" transform="rotate(-14 196 286)"/>
    <ellipse cx="300" cy="290" rx="4" ry="6" transform="rotate(14 300 290)"/>
    <ellipse cx="232" cy="322" rx="4" ry="6" transform="rotate(-6 232 322)"/>
    <ellipse cx="278" cy="330" rx="4" ry="6" transform="rotate(6 278 330)"/>
    <ellipse cx="256" cy="386" rx="4" ry="6"/>
  </g>

  <!-- crown leaves -->
  <g fill="url(#leaf)">
    <ellipse cx="256" cy="150" rx="17" ry="44"/>
    <ellipse cx="218" cy="160" rx="17" ry="40" transform="rotate(-38 218 160)"/>
    <ellipse cx="294" cy="160" rx="17" ry="40" transform="rotate(38 294 160)"/>
    <ellipse cx="184" cy="186" rx="16" ry="34" transform="rotate(-66 184 186)"/>
    <ellipse cx="328" cy="186" rx="16" ry="34" transform="rotate(66 328 186)"/>
  </g>
  <rect x="250" y="104" width="12" height="36" rx="6" fill="#166534"/>

  <!-- eyes -->
  <ellipse cx="220" cy="256" rx="17" ry="21" fill="#ffffff"/>
  <ellipse cx="292" cy="256" rx="17" ry="21" fill="#ffffff"/>
  <ellipse cx="220" cy="258" rx="9" ry="12" fill="#48081d"/>
  <ellipse cx="292" cy="258" rx="9" ry="12" fill="#48081d"/>
  <circle cx="216" cy="251" r="4" fill="#ffffff"/>
  <circle cx="288" cy="251" r="4" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="184" cy="292" rx="20" ry="11" fill="#ffe4ec" opacity="0.6"/>
  <ellipse cx="328" cy="292" rx="20" ry="11" fill="#ffe4ec" opacity="0.6"/>

  <!-- smile -->
  <path d="M236 288c8 14 32 14 40 0" stroke="#5b0a1e" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- highlight -->
  <ellipse cx="196" cy="196" rx="28" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-28 196 196)"/>

  <!-- bubbles -->
  <circle cx="92" cy="104" r="14" fill="#ffffff" opacity="0.3"/>
  <circle cx="424" cy="88" r="9" fill="#ffffff" opacity="0.35"/>
  <circle cx="436" cy="380" r="16" fill="#ffffff" opacity="0.22"/>
  <circle cx="86" cy="372" r="8" fill="#ffffff" opacity="0.3"/>
</svg>
